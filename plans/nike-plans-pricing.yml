provider: Nike
providerId: nike
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Athletic
  - E-Commerce
  - Retail
  - Products
notes: Nike does not operate a publicly accessible developer program with self-service signup or public
  pricing. The developer.nike.com host did not respond at reconciliation time. API access (product catalog,
  inventory, orders) is partner-onboarded under bilateral agreements; no public price book exists. Reconcile
  if Nike re-launches a public API portal.
description: Nike's developer APIs are partner-only and not self-serve. There is no public pricing for
  Nike's product catalog, inventory, store-locator, or e-commerce APIs. The Nike Run Club / Training
  Club consumer apps and SNKRS application use internal APIs not exposed to third-party developers.
sources:
  - https://developer.nike.com/
  - https://www.nike.com/
plans:
  - id: nike-partner
    name: Nike Partner Program
    type: enterprise
    description: Bilateral partner program for retail and digital partners requiring Nike product catalog,
      inventory, or commerce data.
    entries:
      - label: Partner contract
        name: nike_partner_contract
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact partner team
        userMultiplied: false
    elements:
      - name: Partner onboarding required
      - name: Custom commercial terms
      - name: Product catalog access (where contracted)
      - name: Inventory feeds (where contracted)
